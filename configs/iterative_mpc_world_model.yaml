seed: 42
mpc_config: configs/mpc_joint_teams.yaml
mpc_profile: teacher_training
initial_world_model_checkpoint: checkpoints/world_model_as2/best.pt
initial_dataset: data/world_model_as2
working_root: outputs/iterative_mpc_world_model_finetune

skill_policies:
  skill_policy_source: local
  skill_checkpoint: latest
  walk_policy_dir: checkpoints/reproduction/walk
  dribble_policy_dir: checkpoints/reproduction/dribble
  shoot_policy_dir: checkpoints/reproduction/shoot
  terminal_value_checkpoint: checkpoints/terminal_value_bootstrap/best.pt
  terminal_value_coefficient: 0.05
  num_envs: 16
  device: cuda:6
  policy_device: cpu

iterative_training:
  num_iterations: 3
  episodes_per_iteration: 2000
  warm_start_world_model: true
  max_finetune_epochs: 50
  early_stopping_patience: 10
  preserve_initial_validation_set: true
  create_iteration_validation_set: true
  accept_only_if_improved: true
  device: cuda:6

world_model_update:
  sampling:
    initial_random: 0.25
    initial_scripted: 0.20
    previous_mpc: 0.25
    newest_mpc: 0.20
    rare_events: 0.10
  training_overrides:
    training:
      learning_rate: 0.0001
      mixed_precision: true
      num_workers: 4

model_acceptance:
  max_original_validation_degradation_fraction: 0.05
  require_recent_validation_improvement: true
  max_ball_rollout_error_degradation_fraction: 0.03
  max_reward_error_degradation_fraction: 0.05
  max_termination_brier_degradation_fraction: 0.05
  minimum_uncertainty_ratio: 0.10
  maximum_uncertainty_ratio: 10.0
  require_finite_horizon_20_rollout: true
  # Average RMSE is insufficient for MPC: accepted checkpoints must also order
  # held-out short action sequences better than chance.
  minimum_recent_reward_spearman: 0.20
  minimum_recent_reward_pairwise_accuracy: 0.55
  max_reward_ranking_degradation_fraction: 0.05

acceptance_evaluation:
  batch_size: 2048
  rollout_horizon: 20
  max_sequences: 256
  ranking_horizon: 2
  ranking_max_sequences: 1024
