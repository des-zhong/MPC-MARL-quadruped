seed: 42
mpc_config: configs/mpc.yaml
terminal_value_config: configs/terminal_value.yaml
initial_terminal_value_checkpoint: null
initial_value_dataset: data/world_model_as2
mpc_profile: offline_high_quality
initial_world_model_checkpoint: checkpoints/world_model_as2/best.pt
initial_dataset: data/world_model_as2
working_root: outputs/iterative_mpc_world_model

skill_policies:
  skill_policy_source: wandb
  skill_checkpoint: latest
  walk_wandb_run: des_zhong/as2_walking/3a6g1def
  dribble_wandb_run: des_zhong/as2_dribbling/cp9m21ay
  shoot_wandb_run: des_zhong/as2_shooting/bve3isir
  device: cuda:0
  policy_device: cpu

iterative_training:
  num_iterations: 5
  episodes_per_iteration: 1000
  warm_start_world_model: true
  max_finetune_epochs: 50
  early_stopping_patience: 10
  preserve_initial_validation_set: true
  create_iteration_validation_set: true
  accept_only_if_improved: true
  device: cuda

world_model_update:
  sampling:
    initial_random: 0.25
    initial_scripted: 0.20
    previous_mpc: 0.25
    newest_mpc: 0.20
    rare_events: 0.10
  training_overrides:
    training:
      learning_rate: 0.0001
      mixed_precision: true
      num_workers: 4

model_acceptance:
  max_original_validation_degradation_fraction: 0.05
  require_recent_validation_improvement: true
  max_ball_rollout_error_degradation_fraction: 0.03
  max_reward_error_degradation_fraction: 0.05
  max_termination_brier_degradation_fraction: 0.05
  minimum_uncertainty_ratio: 0.10
  maximum_uncertainty_ratio: 10.0
  require_finite_horizon_20_rollout: true

acceptance_evaluation:
  batch_size: 2048
  rollout_horizon: 20
  max_sequences: 256
