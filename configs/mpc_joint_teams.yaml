# Privileged teacher planning over two equal AS2 teams. The first team is
# optimized by CEM; the second team's frozen-policy forecast is held fixed.
seed: 42
world_model:
  macro_action_steps: 10
  history_length: 1
  max_obstacles: 0
environment:
  robot: as2
  team_size: 2
  num_robots: 4
mpc:
  algorithm: cem
  horizon: 5
  num_candidates: 128
  num_elites: 16
  num_iterations: 3
  candidate_batch_size: 128
  skill_temperature: 1.0
  min_skill_probability: 0.02
  initial_parameter_std_fraction: 0.50
  min_parameter_std_fraction: 0.03
  max_parameter_std_fraction: 0.75
  categorical_smoothing: 0.25
  continuous_smoothing: 0.25
  warm_start: true
  deterministic_world_model: true
  gamma: 0.99
  uncertainty_penalty: 0.10
  return_std_penalty: 0.50
  ensemble_objective: mean_minus_std
  termination_threshold: 0.50
  skill_switch_penalty: 0.01
  command_change_penalty: 0.01
  collision_penalty: 1.0
  out_of_bounds_penalty: 2.0
  robot_fall_penalty: 1.0
  invalid_skill_penalty: 2.0
  dribble_affordance_distance_m: 1.0
  shoot_affordance_distance_m: 0.75
  shoot_min_forward_m: -0.10
  shoot_lateral_reach_m: 0.45
  ball_setup_penalty: 0.5
  dribble_target_forward_m: 0.35
  shoot_target_distance_m: 0.45
  backward_dribble_penalty: 0.5
  dribble_forward_speed_scale_mps: 1.0
  reposition_approach_coefficient: 2.0
  reposition_command_alignment_coefficient: 1.0
  reposition_first_step_multiplier: 3.0
  ball_progress_coefficient: 0.0
  possession_coefficient: 0.0
  goal_probability_bonus: 0.0
  event_coefficients: {}
  objective_mode: reward_only
  use_terminal_value: false
  execute_mean_action: false
  execute_best_sample: true
  execution_action_smoothing: 0.0
  minimum_skill_duration: 1
  fallback_policy: safe_reposition
  uncertainty_fallback_threshold: 0.50
  warm_start_uncertainty_threshold: 0.30
  invalid_objective: -1000000000.0
  max_candidate_diagnostics: 0
  seed: 42
mpc_profiles:
  teacher_training:
    horizon: 5
    num_candidates: 128
    num_elites: 16
    num_iterations: 3
    candidate_batch_size: 128
  teacher_high_quality:
    horizon: 8
    num_candidates: 512
    num_elites: 64
    num_iterations: 5
    candidate_batch_size: 128
