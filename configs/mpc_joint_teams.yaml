# Privileged teacher planning over two equal AS2 teams. The first team is
# optimized by CEM; the second team slowly walks toward the ball.
seed: 42
world_model:
  macro_action_steps: 10
  history_length: 4
  max_obstacles: 0
environment:
  robot: as2
  team_size: 2
  num_robots: 4
  boundary_walls: true
opponent:
  mode: slow_walk_to_ball
  walk_speed_mps: 0.35
  stop_distance_m: 0.25
  slow_distance_m: 1.0
  yaw_gain: 1.0
mpc:
  algorithm: cem
  # Recorded closed-loop diagnostics are already inaccurate beyond two macro
  # steps, so keep each teacher plan short. The online trainer controls how
  # often CEM is called (every two real decisions by default).
  horizon: 2
  num_candidates: 128
  num_elites: 16
  num_iterations: 3
  candidate_batch_size: 64
  skill_temperature: 1.0
  min_skill_probability: 0.02
  initial_parameter_std_fraction: 0.50
  min_parameter_std_fraction: 0.03
  max_parameter_std_fraction: 0.75
  categorical_smoothing: 0.25
  continuous_smoothing: 0.25
  warm_start: true
  deterministic_world_model: true
  # Risk-aware analytical objective. The untrained online terminal value and
  # planner-only action costs are disabled for the production teacher.
  gamma: 0.99
  uncertainty_penalty: 0.10
  return_uncertainty_penalty: 0.50
  # The simplified simulator reward has no invalid-request or control-change
  # costs. Direct-execution training also applies neither action override.
  skill_switch_penalty: 0.0
  command_change_penalty: 0.0
  invalid_skill_penalty: 0.0
  apply_skill_fallback_in_rollout: false
  apply_collision_avoidance_in_rollout: false
  dribble_affordance_distance_m: 1.0
  shoot_affordance_distance_m: 0.75
  shoot_min_forward_m: -0.10
  shoot_lateral_reach_m: 0.45
  fallback_walk_speed_mps: 0.9
  # Match HighLevelSkillWrapper._apply_collision_avoidance.
  collision_avoidance_lookahead_s: 0.6
  collision_avoidance_distance_m: 0.9
  collision_avoidance_speed_mps: 0.8
  reward_source: analytical
  learned_reward_coefficient: 0.0
  analytical_reward_coefficient: 1.0
  analytical_macro_dt: 0.2
  analytical_event_dt: 0.02
  analytical_robot_collision_distance_m: 0.70
  analytical_robot_collision_lookahead_s: 0.25
  # Calibrated to the maximum in outputs/mpc_visualizations. The 99th
  # percentile (0.75) rejected every candidate at a deterministic kickoff.
  max_state_uncertainty: 1.0
  max_return_uncertainty: null
  # Preserve the hard OOD filter whenever at least one candidate passes it.
  # If an entire environment row is OOD, choose its best numerically finite,
  # uncertainty-penalized candidate instead of aborting all data collection.
  relax_ood_when_all_candidates_rejected: true
  objective_mode: reward_only
  terminal_handling: probability_weighted
  terminal_value:
    enabled: false
    checkpoint: checkpoints/terminal_value_mpc/best.pt
    required: false
    # Available for explicit value-model experiments; disabled by default.
    coefficient: 0.05
    uncertainty_gating: true
    uncertainty_beta: 1.0
    # Keep null until ensemble disagreement has been calibrated on a held-out
    # candidate-ranking run; soft uncertainty gating remains active meanwhile.
    max_uncertainty: null
  max_candidate_diagnostics: 0
  seed: 42
mpc_profiles:
  teacher_training:
    horizon: 2
    num_candidates: 128
    num_elites: 16
    num_iterations: 3
    candidate_batch_size: 64
  teacher_high_quality:
    horizon: 2
    num_candidates: 512
    num_elites: 64
    num_iterations: 5
    candidate_batch_size: 128
