seed: 42

world_model:
  macro_action_steps: 10
  history_length: 1
  max_obstacles: 2

environment:
  robot: go1
  num_robots: 2
  num_envs: 256
  episode_length: 20.0
  field_length: 8.0
  field_width: 5.0
  goal_half_width: 1.0

data_collection:
  num_episodes: 10000
  shard_episodes: 1
  repeat_previous_skill_probability: 0.35
  behavior_mixture:
    random_valid: 0.50
    scripted: 0.30
    existing_policy: 0.20
  random_sampling:
    uniform: 0.40
    gaussian_nominal: 0.30
    boundary_focused: 0.20
    goal_directed: 0.10

dataset:
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10
  rare_event_fraction: 0.25

model:
  ensemble_size: 5
  hidden_dims: [512, 512, 512]
  skill_embedding_dim: 16
  cylinder_embedding_dim: 64
  activation: silu
  layer_norm: true
  min_log_variance: -10.0
  max_log_variance: 2.0

loss:
  robot_position_weight: 1.0
  robot_velocity_weight: 0.5
  robot_orientation_weight: 0.5
  ball_position_weight: 2.0
  ball_velocity_weight: 2.0
  reward_weight: 1.0
  termination_weight: 1.0
  event_weight: 1.0

training:
  device: cuda
  batch_size: 1024
  sequence_batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.00001
  max_epochs: 200
  gradient_clip_norm: 10.0
  early_stopping_patience: 20
  # Save rolling.pt every N completed epochs. best.pt is written only when
  # validation improves and can therefore never be overwritten by a worse epoch.
  rolling_checkpoint_interval: 10
  mixed_precision: true
  num_workers: 4
  normalize_reward: false
  sequence_length: 5
  multi_step_loss_weight: 0.25
  multi_step_start_epoch: 10
  multi_step_discount: 0.8
  teacher_forcing_probability_start: 1.0
  teacher_forcing_probability_end: 0.0

evaluation:
  horizons: [1, 3, 5, 10, 20]
