value_model:
  enabled: true
  gamma: 0.99
  target_type: monte_carlo
  bootstrap_on_truncation: true
  exclude_truncated_tail_steps: 8
  hidden_dims: [512, 512, 256]
  activation: silu
  layer_norm: true
  dropout: 0.0
  loss: huber
  huber_delta: 1.0
  learning_rate: 0.0003
  weight_decay: 0.00001
  batch_size: 1024
  max_epochs: 200
  early_stopping_patience: 20
  gradient_clip_norm: 10.0
  num_workers: 0
  mixed_precision: true
  normalize_targets: true
  ensemble_size: 1
  seed: 42
  device: cuda
  split:
    train: 0.8
    validation: 0.1
    test: 0.1
