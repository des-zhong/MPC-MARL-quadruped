# Skill-level MPC configuration for the AS2 multi-robot football environment.
seed: 42
mpc_profile: fast_validation

world_model:
  # One HighLevelSkillWrapper.step already holds this many 20 ms updates.
  macro_action_steps: 10
  history_length: 1
  max_obstacles: 2

environment:
  robot: as2
  num_robots: 2
  num_envs: 16
  episode_length: 20.0
  field_length: 8.0
  field_width: 5.0
  goal_half_width: 1.0
  boundary_walls: true

mpc:
  algorithm: cem
  horizon: 8
  num_candidates: 2048
  num_elites: 128
  num_iterations: 5
  candidate_batch_size: 256
  skill_temperature: 1.0
  min_skill_probability: 0.02
  initial_parameter_std_fraction: 0.50
  min_parameter_std_fraction: 0.03
  max_parameter_std_fraction: 0.75
  categorical_smoothing: 0.25
  continuous_smoothing: 0.25
  warm_start: true
  deterministic_world_model: true
  gamma: 0.99
  uncertainty_penalty: 0.10
  return_uncertainty_penalty: 0.50
  skill_switch_penalty: 0.01
  command_change_penalty: 0.01
  invalid_skill_penalty: 2.0
  apply_skill_fallback_in_rollout: true
  apply_collision_avoidance_in_rollout: true
  dribble_affordance_distance_m: 1.0
  shoot_affordance_distance_m: 0.75
  shoot_min_forward_m: -0.10
  shoot_lateral_reach_m: 0.45
  fallback_walk_speed_mps: 0.9
  collision_avoidance_lookahead_s: 0.6
  collision_avoidance_distance_m: 0.9
  collision_avoidance_speed_mps: 0.8
  # Reconstruct the known high-level reward from imagined states/events. The
  # learned scalar head remains available with reward_source: learned/blend.
  reward_source: analytical
  learned_reward_coefficient: 0.0
  analytical_reward_coefficient: 1.0
  analytical_macro_dt: 0.2
  analytical_event_dt: 0.02
  # 1.0 is the measured maximum selected-plan state uncertainty in
  # outputs/mpc_visualizations; candidates beyond it are treated as OOD.
  max_state_uncertainty: 1.0
  max_return_uncertainty: null
  relax_ood_when_all_candidates_rejected: true
  objective_mode: reward_plus_terminal_value
  terminal_handling: probability_weighted
  terminal_value:
    enabled: true
    checkpoint: checkpoints/terminal_value_mpc/best.pt
    required: true
    # Monte-Carlo V is trained on the behavior mixture rather than the
    # optimal-policy value; keep it as a continuation prior, not the dominant
    # candidate-ranking signal.
    coefficient: 0.05
    uncertainty_gating: true
    uncertainty_beta: 1.0
    max_uncertainty: null
  max_candidate_diagnostics: 0
  seed: 42

mpc_profiles:
  offline_high_quality:
    horizon: 10
    num_candidates: 4096
    num_elites: 256
    num_iterations: 7
    candidate_batch_size: 256
  fast_validation:
    horizon: 10
    num_candidates: 256
    num_elites: 32
    num_iterations: 3
    candidate_batch_size: 128
  realtime:
    horizon: 5
    num_candidates: 128
    num_elites: 16
    num_iterations: 3
    candidate_batch_size: 128
  visualization:
    # Shorter rollouts reduce exploitation of accumulated yaw and command-lag
    # error in the current world model.
    horizon: 5
    num_candidates: 512
    num_elites: 64
    num_iterations: 5
    candidate_batch_size: 128
    max_candidate_diagnostics: 128

teacher:
  distribution_source: final_cem
  minimum_skill_probability: 0.01
  minimum_parameter_std_fraction: 0.02
  behavior_mode: mpc
  detailed_diagnostic_episodes: 5

world_model_expansion:
  train_fraction: 0.80
  validation_fraction: 0.20
  test_fraction: 0.0

evaluation:
  confidence_level: 0.95
  methods:
    - random_valid
    - scripted
    - greedy_h1
    - mpc
  horizons: [1, 3, 5, 8, 10]
  candidate_counts: [128, 256, 512, 1024, 2048, 4096]
  cem_iterations: [1, 3, 5, 7]

visualization:
  save_frame_sequence: true
  save_video: true
  fps: 5.0
