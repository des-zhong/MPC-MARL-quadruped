# AS2 world-model collection/training preset. Model and dataset settings match
# the Go1 preset; simulator asset/controller selection is robot-specific.
seed: 42

world_model:
  macro_action_steps: 10
  # Match the high-level coordinator checkpoint observation history so the
  # frozen opponent can be forecast consistently by standalone MPC scripts.
  history_length: 4
  max_obstacles: 0

environment:
  robot: as2
  # Two equal AS2 teams are collected. The saved joint schema therefore has
  # num_robots = 2 * team_size.
  team_size: 2
  num_robots: 4
  num_envs: 256
  episode_length: 20.0
  field_length: 8.0
  field_width: 5.0
  goal_half_width: 1.0
  # Keep a substantial fraction of ordinary resets immediately usable by the
  # dribble/shoot policies instead of exposing the collector almost only to
  # far-away walking states.
  near_ball_init_probability: 0.4
  near_ball_init_min_distance: 0.4
  near_ball_init_max_distance: 0.95
  near_ball_init_max_angle: 0.35

data_collection:
  num_episodes: 20000
  shard_episodes: 1
  repeat_previous_skill_probability: 0.35
  behavior_mixture:
    # Base samples are 90% goal-oriented scripted soccer and 10% exploratory.
    # Both teams use the same controller, mirrored toward opposite goals.
    # Repeat/targeted overrides are logged separately in each transition.
    random_valid: 0.10
    scripted: 0.90
    existing_policy: 0.0
    targeted_rare_event: 0.0
  random_sampling:
    uniform: 0.20
    gaussian_nominal: 0.20
    boundary_focused: 0.20
    goal_directed: 0.40
  # Stage a minority of episodes near rare tactical outcomes. These actions
  # override the base sampler and retain their targeted_rare_event source tag.
  targeted_rare_events:
    enabled: true
    episode_probability: 0.25
    max_macro_steps: 5
    ball_speed: 3.0
    scenarios:
      - goal
      - own_goal
      - out_of_bounds
      - teammate_collision
      - possession_acquired
      - possession_lost
      - successful_shot
      - failed_shot
      - pass
  minimum_event_counts:
    goal: 1000
    own_goal: 1000
    out_of_bounds: 1000
    teammate_collision: 5000
    possession_acquired: 5000
    possession_lost: 3000
    successful_shot: 3000
    failed_shot: 3000
    pass: 2000
  max_extra_episodes: 5000
  require_minimum_event_counts: true

dataset:
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10
  rare_event_fraction: 0.25

model:
  ensemble_size: 5
  hidden_dims: [512, 512, 512]
  skill_embedding_dim: 16
  cylinder_embedding_dim: 64
  activation: silu
  layer_norm: true
  min_log_variance: -10.0
  max_log_variance: 2.0

loss:
  robot_position_weight: 1.0
  robot_velocity_weight: 0.5
  robot_orientation_weight: 0.5
  ball_position_weight: 2.0
  ball_velocity_weight: 2.0
  reward_weight: 1.0
  termination_weight: 1.0
  event_weight: 1.0

training:
  device: cuda
  batch_size: 1024
  sequence_batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.00001
  max_epochs: 500
  gradient_clip_norm: 10.0
  early_stopping_patience: 20
  # Save rolling.pt every N completed epochs. best.pt is written only when
  # validation improves and can therefore never be overwritten by a worse epoch.
  rolling_checkpoint_interval: 10
  mixed_precision: true
  num_workers: 4
  normalize_reward: false
  sequence_length: 5
  multi_step_loss_weight: 0.25
  multi_step_start_epoch: 10
  multi_step_discount: 0.8
  teacher_forcing_probability_start: 1.0
  teacher_forcing_probability_end: 0.0

evaluation:
  horizons: [1, 3, 5, 10, 20]
